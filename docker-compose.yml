services:
  postgres:
    image: postgres:16-alpine
    container_name: product-stock-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_stock_db
    volumes:
      - dados_salvos:/var/lib/postgresql/data

volumes:
  dados_salvos:
